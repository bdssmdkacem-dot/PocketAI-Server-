name: PocketAI Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketai-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform scaffold
        run: |
          if [ ! -d android/app ]; then
            flutter create . --platforms=android --org com.pocketai --project-name pocket_ai_server
          fi

      - name: Prepare Android NDK
        run: |
          SDK_ROOT="$ANDROID_SDK_ROOT"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="$ANDROID_HOME"; fi
          if [ -d "$SDK_ROOT/ndk/27.3.13750724" ]; then
            NDK_DIR="$SDK_ROOT/ndk/27.3.13750724"
          else
            echo "Required NDK 27.3.13750724 was not found."
            ls -la "$SDK_ROOT/ndk" || true
            exit 1
          fi
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Fetch pinned llama.cpp
        run: bash scripts/fetch_llama_cpp.sh

      - name: Restore PocketAI native files
        run: |
          mkdir -p android/app/src/main/kotlin/com/pocketai/server
          mkdir -p android/app/src/main/cpp
          cp android/pocketai_template/app/src/main/kotlin/com/pocketai/server/MainActivity.kt android/app/src/main/kotlin/com/pocketai/server/MainActivity.kt
          cp android/pocketai_template/app/src/main/kotlin/com/pocketai/server/NativeAi.kt android/app/src/main/kotlin/com/pocketai/server/NativeAi.kt
          cp android/pocketai_template/app/src/main/cpp/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt
          cp android/pocketai_template/app/src/main/cpp/ai_bridge.cpp android/app/src/main/cpp/ai_bridge.cpp

      - name: Enable Android externalNativeBuild
        run: python3 scripts/configure_android_native.py

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build Flutter-only smoke APK
        run: |
          set -e
          cp android/app/build.gradle.kts /tmp/pocketai-build.gradle.kts
          rm -rf android/app/src/main/cpp android/app/src/main/jniLibs
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          start = s.find("externalNativeBuild {")
          if start != -1:
              depth = 0
              end = None
              for i in range(start, len(s)):
                  if s[i] == "{": depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end: s = s[:start] + s[end:]
          p.write_text(s)
          PY
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/pocketai-flutter-smoke.apk

      - name: Sign Flutter-only smoke APK
        run: |
          APK="build/app/outputs/flutter-apk/pocketai-flutter-smoke.apk"
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias AndroidDebugKey "$APK"

      - name: Restore native build
        run: |
          cp /tmp/pocketai-build.gradle.kts android/app/build.gradle.kts
          mkdir -p android/app/src/main/cpp
          cp android/pocketai_template/app/src/main/cpp/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt
          cp android/pocketai_template/app/src/main/cpp/ai_bridge.cpp android/app/src/main/cpp/ai_bridge.cpp
          python3 scripts/configure_android_native.py

      - name: Build full native APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Sign full APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias AndroidDebugKey "$APK"

      - name: Static APK diagnostics
        run: |
          set +e
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p diagnostic
          {
            echo "PocketAI Android Diagnostic"
            echo "Commit: $GITHUB_SHA"
            echo "=== Flutter ==="
            flutter --version
            echo "=== Java ==="
            java -version 2>&1
            echo "=== APK files ==="
            ls -lh build/app/outputs/flutter-apk/*.apk
            echo "=== SHA256 ==="
            sha256sum build/app/outputs/flutter-apk/*.apk
            for APK in build/app/outputs/flutter-apk/pocketai-flutter-smoke.apk build/app/outputs/flutter-apk/app-release.apk; do
              echo
              echo "===== $APK ====="
              echo "--- AAPT2 BADGING ---"
              "$BT/aapt2" dump badging "$APK"
              echo "--- MANIFEST ---"
              "$BT/aapt2" dump xmltree "$APK" AndroidManifest.xml | grep -E 'package=|versionCode=|versionName=|minSdkVersion=|targetSdkVersion=|uses-permission|uses-feature|uses-sdk' || true
              echo "--- ZIP CONTENT ---"
              unzip -Z1 "$APK"
              echo "--- NATIVE ABIS ---"
              unzip -Z1 "$APK" | grep '^lib/' | sed -E 's#^lib/([^/]+)/.*#\1#' | sort -u || true
              echo "--- NATIVE LIBRARIES ---"
              unzip -Z1 "$APK" | grep -E '(^|/)lib.*\.so$' | sort || true
              echo "--- ELF HEADERS ---"
              rm -rf /tmp/apk_extract
              mkdir -p /tmp/apk_extract
              unzip -q "$APK" -d /tmp/apk_extract || true
              find /tmp/apk_extract/lib -name '*.so' -type f -print0 2>/dev/null | while IFS= read -r -d '' SO; do
                echo "FILE: $SO"
                file "$SO" || true
                readelf -h "$SO" 2>/dev/null | grep -E 'Class:|Machine:' || true
              done
              echo "--- ZIPALIGN ---"
              "$BT/zipalign" -c -P 4 -v 4 "$APK"
              echo "--- SIGNATURE ---"
              "$BT/apksigner" verify --verbose --print-certs "$APK"
            done
          } | tee diagnostic/report.txt

      - name: Android 13 emulator PackageManager install test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disk-size: 8192M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set +e
            mkdir -p diagnostic/emulator
            adb wait-for-device
            echo "=== EMULATOR ===" | tee diagnostic/emulator/device.txt
            adb shell getprop ro.product.manufacturer | tee -a diagnostic/emulator/device.txt
            adb shell getprop ro.product.model | tee -a diagnostic/emulator/device.txt
            adb shell getprop ro.build.version.release | tee -a diagnostic/emulator/device.txt
            adb shell getprop ro.build.version.sdk | tee -a diagnostic/emulator/device.txt
            adb shell getprop ro.product.cpu.abilist | tee -a diagnostic/emulator/device.txt
            echo | tee -a diagnostic/emulator/device.txt
            echo "=== FEATURES ===" | tee -a diagnostic/emulator/device.txt
            adb shell pm list features | tee -a diagnostic/emulator/device.txt

            echo "===== INSTALL TEST: Flutter smoke APK =====" | tee diagnostic/emulator/pocketai-flutter-smoke-install.txt
            adb install -r build/app/outputs/flutter-apk/pocketai-flutter-smoke.apk > /tmp/flutter-install-output.txt 2>&1; echo $? > /tmp/flutter-install-rc.txt
            FLUTTER_RC=$(cat /tmp/flutter-install-rc.txt)
            cat /tmp/flutter-install-output.txt | tee -a diagnostic/emulator/pocketai-flutter-smoke-install.txt
            echo "EXIT_CODE=$FLUTTER_RC" | tee -a diagnostic/emulator/pocketai-flutter-smoke-install.txt
            echo "--- PM PATH ---" | tee -a diagnostic/emulator/pocketai-flutter-smoke-install.txt
            adb shell pm path com.pocketai.pocket_ai_server 2>&1 | tee -a diagnostic/emulator/pocketai-flutter-smoke-install.txt
            if [ "$FLUTTER_RC" -ne 0 ]; then
              echo "--- PACKAGE MANAGER LOG ---" | tee -a diagnostic/emulator/pocketai-flutter-smoke-install.txt
              adb logcat -d -v time -t 500 2>&1 | grep -Ei 'PackageManager|PackageInstaller|INSTALL_FAILED|Failure|parse|dex|sign|manifest|version|native' | tail -300 | tee -a diagnostic/emulator/pocketai-flutter-smoke-install.txt
            fi

            echo "===== INSTALL TEST: Full native APK =====" | tee diagnostic/emulator/app-release-install.txt
            adb install -r build/app/outputs/flutter-apk/app-release.apk > /tmp/native-install-output.txt 2>&1; echo $? > /tmp/native-install-rc.txt
            NATIVE_RC=$(cat /tmp/native-install-rc.txt)
            cat /tmp/native-install-output.txt | tee -a diagnostic/emulator/app-release-install.txt
            echo "EXIT_CODE=$NATIVE_RC" | tee -a diagnostic/emulator/app-release-install.txt
            echo "--- PM PATH ---" | tee -a diagnostic/emulator/app-release-install.txt
            adb shell pm path com.pocketai.pocket_ai_server 2>&1 | tee -a diagnostic/emulator/app-release-install.txt
            if [ "$NATIVE_RC" -ne 0 ]; then
              echo "--- PACKAGE MANAGER LOG ---" | tee -a diagnostic/emulator/app-release-install.txt
              adb logcat -d -v time -t 500 2>&1 | grep -Ei 'PackageManager|PackageInstaller|INSTALL_FAILED|Failure|parse|dex|sign|manifest|version|native' | tail -300 | tee -a diagnostic/emulator/app-release-install.txt
            fi

            echo "INSTALL_TESTS_COMPLETED=1" | tee diagnostic/emulator/INSTALL_TESTS_COMPLETED.txt
            exit 0

      - name: Diagnostic summary
        if: always()
        run: |
          {
            echo "PocketAI Diagnostic Summary"
            echo "==========================="
            echo "Static APK analysis: completed"
            echo "Flutter-only APK: built, signed and checked"
            echo "Full native APK: built, signed and checked"
            echo "Android 13 PackageManager emulator installation: executed"
            echo
            echo "The emulator installation files contain the exact adb/PackageManager result."
          } | tee diagnostic/SUMMARY.txt

      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketai-android-diagnostic
          if-no-files-found: warn
          path: |
            diagnostic/
            build/app/outputs/flutter-apk/pocketai-flutter-smoke.apk
            build/app/outputs/flutter-apk/app-release.apk
