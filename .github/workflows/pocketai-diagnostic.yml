name: PocketAI Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketai-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform scaffold
        run: |
          if [ ! -d android/app ]; then
            flutter create . --platforms=android --org com.pocketai --project-name pocket_ai_server
          fi

      - name: Prepare Android NDK
        run: |
          SDK_ROOT="$ANDROID_SDK_ROOT"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="$ANDROID_HOME"; fi
          if [ -d "$SDK_ROOT/ndk/27.3.13750724" ]; then
            NDK_DIR="$SDK_ROOT/ndk/27.3.13750724"
          else
            echo "Required NDK 27.3.13750724 was not found."
            ls -la "$SDK_ROOT/ndk" || true
            exit 1
          fi
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Fetch pinned llama.cpp
        run: bash scripts/fetch_llama_cpp.sh

      - name: Restore PocketAI native files
        run: |
          mkdir -p android/app/src/main/kotlin/com/pocketai/server
          mkdir -p android/app/src/main/cpp
          cp android/pocketai_template/app/src/main/kotlin/com/pocketai/server/MainActivity.kt android/app/src/main/kotlin/com/pocketai/server/MainActivity.kt
          cp android/pocketai_template/app/src/main/kotlin/com/pocketai/server/NativeAi.kt android/app/src/main/kotlin/com/pocketai/server/NativeAi.kt
          cp android/pocketai_template/app/src/main/cpp/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt
          cp android/pocketai_template/app/src/main/cpp/ai_bridge.cpp android/app/src/main/cpp/ai_bridge.cpp

      - name: Enable Android externalNativeBuild
        run: python3 scripts/configure_android_native.py

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build Flutter-only x64 smoke APK
        run: |
          set -e
          cp android/app/build.gradle.kts /tmp/pocketai-build.gradle.kts
          rm -rf android/app/src/main/cpp android/app/src/main/jniLibs
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          start = s.find("externalNativeBuild {")
          if start != -1:
              depth = 0
              end = None
              for i in range(start, len(s)):
                  if s[i] == "{": depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end: s = s[:start] + s[end:]
          p.write_text(s)
          PY
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/pocketai-flutter-smoke-x64.apk

      - name: Sign Flutter-only x64 smoke APK
        run: |
          APK="build/app/outputs/flutter-apk/pocketai-flutter-smoke-x64.apk"
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias AndroidDebugKey "$APK"
          mkdir -p diagnostic/apks
          cp "$APK" diagnostic/apks/pocketai-flutter-smoke-x64.apk

      - name: Restore native build
        run: |
          cp /tmp/pocketai-build.gradle.kts android/app/build.gradle.kts
          mkdir -p android/app/src/main/cpp
          cp android/pocketai_template/app/src/main/cpp/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt
          cp android/pocketai_template/app/src/main/cpp/ai_bridge.cpp android/app/src/main/cpp/ai_bridge.cpp
          python3 scripts/configure_android_native.py

      - name: Configure native x64 runtime build
        env:
          POCKETAI_ABI: x86_64
        run: python3 scripts/configure_android_native.py

      - name: Build full native x64 runtime-test APK
        run: |
          set -e
          flutter clean
          rm -rf android/.cxx android/app/.cxx build
          flutter pub get
          echo "=== Generated Android native configuration (diagnostic only) ==="
          cd android
          grep -n -A8 -B3 'externalNativeBuild' app/build.gradle.kts || true
          grep -n 'path = file("src/main/cpp/CMakeLists.txt")' app/build.gradle.kts || true
          grep -n -A6 -B2 'abiFilters' app/build.gradle.kts || true
          cd ..
          echo "=== Standalone CMake/NDK native x64 build ==="
          rm -rf android/app/src/main/jniLibs
          mkdir -p android/app/src/main/jniLibs/x86_64
          rm -rf /tmp/pocketai-cmake-x64
          cmake -S android/app/src/main/cpp -B /tmp/pocketai-cmake-x64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/pocketai-cmake-x64 --target pocket_ai --parallel 2
          echo "=== Standalone native outputs ==="
          find /tmp/pocketai-cmake-x64 -type f -name 'libpocket_ai.so' -print
          NATIVE_SO="$(find /tmp/pocketai-cmake-x64 -type f -name 'libpocket_ai.so' | head -1)"
          test -n "$NATIVE_SO"
          cp "$NATIVE_SO" android/app/src/main/jniLibs/x86_64/libpocket_ai.so
          file android/app/src/main/jniLibs/x86_64/libpocket_ai.so
          readelf -h android/app/src/main/jniLibs/x86_64/libpocket_ai.so | grep -E 'Class:|Machine:'
          echo "=== Verify JNI source registration ==="
          grep -n -A8 -B3 'jniLibs' android/app/build.gradle.kts || true
          test -f android/app/src/main/jniLibs/x86_64/libpocket_ai.so
          echo "=== Build native x64 Flutter APK with jniLibs packaging ==="
          flutter build apk --release --target-platform android-x64
          echo "=== Inspect merged native libraries before verification ==="
          find build/app/intermediates -path '*merged_native_libs*' -type f -name 'libpocket_ai.so' -print 2>/dev/null | sort || true
          find android/app/build -type f -name 'libpocket_ai.so' -print 2>/dev/null | sort || true
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/pocketai-native-x64.apk
          echo "=== Inspect Flutter APK before native injection ==="
          FLUTTER_APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$FLUTTER_APK"
          unzip -Z1 "$FLUTTER_APK" | grep '^lib/' | sort || true
          echo "=== Package merged native library into final APK ==="
          MERGED_SO="build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/x86_64/libpocket_ai.so"
          test -f "$MERGED_SO"
          mkdir -p /tmp/pocketai-apk-native/lib/x86_64
          # Package the complete llama.cpp dependency closure, not only pocket_ai.
          MERGED_LIB_DIR="build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/x86_64"
          test -d "$MERGED_LIB_DIR"
          find "$MERGED_LIB_DIR" -maxdepth 1 -type f -name '*.so' -print | sort
          cp "$MERGED_LIB_DIR"/*.so /tmp/pocketai-apk-native/lib/x86_64/
          cp "$FLUTTER_APK" /tmp/pocketai-native-x64-unsigned.apk
          (cd /tmp/pocketai-apk-native && zip -q -r /tmp/pocketai-native-x64-unsigned.apk lib)
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -f -P 4 4 /tmp/pocketai-native-x64-unsigned.apk /tmp/pocketai-native-x64-aligned.apk
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias AndroidDebugKey /tmp/pocketai-native-x64-aligned.apk
          mkdir -p build/app/outputs/flutter-apk
          cp /tmp/pocketai-native-x64-aligned.apk build/app/outputs/flutter-apk/pocketai-native-x64.apk
          echo "=== Verify final native x64 APK payload ==="
          unzip -Z1 build/app/outputs/flutter-apk/pocketai-native-x64.apk | grep '^lib/' | sort || true
          unzip -Z1 build/app/outputs/flutter-apk/pocketai-native-x64.apk | grep -qx "lib/x86_64/libpocket_ai.so"

      - name: Sign full native x64 runtime-test APK
        run: |
          APK="build/app/outputs/flutter-apk/pocketai-native-x64.apk"
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias AndroidDebugKey "$APK"

      - name: Configure native ARM64 release build
        env:
          POCKETAI_ABI: arm64-v8a
        run: python3 scripts/configure_android_native.py

      - name: Build full native ARM64 APK
        run: |
          set -e
          flutter clean
          rm -rf android/.cxx android/app/.cxx build
          flutter pub get
          echo "=== Standalone CMake/NDK native ARM64 build ==="
          rm -rf android/app/src/main/jniLibs
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          rm -rf /tmp/pocketai-cmake-arm64
          cmake -S android/app/src/main/cpp -B /tmp/pocketai-cmake-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/pocketai-cmake-arm64 --target pocket_ai --parallel 2
          NATIVE_SO="$(find /tmp/pocketai-cmake-arm64 -type f -name 'libpocket_ai.so' | head -1)"
          test -n "$NATIVE_SO"
          cp "$NATIVE_SO" android/app/src/main/jniLibs/arm64-v8a/libpocket_ai.so
          file android/app/src/main/jniLibs/arm64-v8a/libpocket_ai.so
          readelf -h android/app/src/main/jniLibs/arm64-v8a/libpocket_ai.so | grep -E 'Class:|Machine:'
          flutter build apk --release --target-platform android-arm64
          FLUTTER_APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$FLUTTER_APK"
          MERGED_SO="build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/arm64-v8a/libpocket_ai.so"
          test -f "$MERGED_SO"
          mkdir -p /tmp/pocketai-apk-native-arm64/lib/arm64-v8a
          cp "$MERGED_SO" /tmp/pocketai-apk-native-arm64/lib/arm64-v8a/libpocket_ai.so
          cp "$FLUTTER_APK" /tmp/pocketai-native-arm64-unsigned.apk
          (cd /tmp/pocketai-apk-native-arm64 && zip -q -r /tmp/pocketai-native-arm64-unsigned.apk lib)
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -f -P 4 4 /tmp/pocketai-native-arm64-unsigned.apk /tmp/pocketai-native-arm64-aligned.apk
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias AndroidDebugKey /tmp/pocketai-native-arm64-aligned.apk
          mkdir -p build/app/outputs/flutter-apk
          cp /tmp/pocketai-native-arm64-aligned.apk build/app/outputs/flutter-apk/pocketai-native-arm64.apk
          echo "=== Verify final native ARM64 APK payload ==="
          unzip -Z1 build/app/outputs/flutter-apk/pocketai-native-arm64.apk | grep '^lib/' | sort || true
          unzip -Z1 build/app/outputs/flutter-apk/pocketai-native-arm64.apk | grep -qx "lib/arm64-v8a/libpocket_ai.so"

      - name: Static APK diagnostics
        run: |
          set +e
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p diagnostic
          {
            echo "PocketAI Android Diagnostic"
            echo "Commit: $GITHUB_SHA"
            echo "=== Flutter ==="
            flutter --version
            echo "=== Java ==="
            java -version 2>&1
            echo "=== APK files ==="
            ls -lh build/app/outputs/flutter-apk/*.apk
            echo "=== SHA256 ==="
            sha256sum build/app/outputs/flutter-apk/*.apk
            for APK in diagnostic/apks/pocketai-flutter-smoke-x64.apk build/app/outputs/flutter-apk/pocketai-native-x64.apk build/app/outputs/flutter-apk/pocketai-native-arm64.apk; do
              echo
              echo "===== $APK ====="
              echo "--- AAPT2 BADGING ---"
              "$BT/aapt2" dump badging "$APK"
              echo "--- MANIFEST ---"
              "$BT/aapt2" dump xmltree "$APK" AndroidManifest.xml | grep -E 'package=|versionCode=|versionName=|minSdkVersion=|targetSdkVersion=|uses-permission|uses-feature|uses-sdk' || true
              echo "--- NATIVE ABIS ---"
              unzip -Z1 "$APK" | grep '^lib/' | sed -E 's#^lib/([^/]+)/.*#\1#' | sort -u || true
              echo "--- NATIVE LIBRARIES ---"
              unzip -Z1 "$APK" | grep -E '(^|/)lib.*\.so$' | sort || true
              echo "--- ELF HEADERS ---"
              rm -rf /tmp/apk_extract
              mkdir -p /tmp/apk_extract
              unzip -q "$APK" -d /tmp/apk_extract || true
              find /tmp/apk_extract/lib -name '*.so' -type f -print0 2>/dev/null | while IFS= read -r -d '' SO; do
                echo "FILE: $SO"
                file "$SO" || true
                readelf -h "$SO" 2>/dev/null | grep -E 'Class:|Machine:' || true
              done
              echo "--- ZIPALIGN ---"
              "$BT/zipalign" -c -P 4 -v 4 "$APK"
              echo "--- SIGNATURE ---"
              "$BT/apksigner" verify --verbose --print-certs "$APK"
            done
          } | tee diagnostic/report.txt

      - name: Android 13 x86_64 emulator Flutter UI install test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          force-avd-creation: true
          disable-animations: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          script: python3 diagnostic/scripts/emulator_install_test.py

      - name: Diagnostic summary
        if: always()
        run: |
          set +e
          DIAG_DIR="$GITHUB_WORKSPACE/diagnostic"
          mkdir -p "$DIAG_DIR"
          {
            echo "PocketAI Diagnostic Summary"
            echo "==========================="
            echo "Flutter/UI x64 APK: built, signed and tested on Android 13 x86_64 emulator"
            echo "Full native ARM64 APK: built, signed and statically checked"
            echo "ARM64 native APK emulator installation: intentionally skipped due ABI mismatch"
            echo
            echo "The emulator installation file contains the exact adb/PackageManager result."
          } > "$DIAG_DIR/SUMMARY.txt"
          cat "$DIAG_DIR/SUMMARY.txt"
          test -f "$DIAG_DIR/SUMMARY.txt"

      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketai-android-diagnostic
          if-no-files-found: warn
          path: |
            diagnostic/
            diagnostic/apks/pocketai-flutter-smoke-x64.apk
            build/app/outputs/flutter-apk/pocketai-native-x64.apk
            build/app/outputs/flutter-apk/pocketai-native-arm64.apk
