name: PocketAI Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketai-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform scaffold
        run: |
          if [ ! -d android/app ]; then
            flutter create . --platforms=android --org com.pocketai --project-name pocket_ai_server
          fi

      - name: Enable local HTTP server networking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Enable test-only Android debugging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)
          p.write_text(s)
          PY

      - name: Download tiny GGUF inference test model
        run: |
          set -e
          mkdir -p diagnostic/model
          curl -L --fail --retry 3 --retry-delay 2 \
            -o diagnostic/model/stories15M-q4_0.gguf \
            https://huggingface.co/ggml-org/tiny-llamas/resolve/main/stories15M-q4_0.gguf
          test -s diagnostic/model/stories15M-q4_0.gguf
          echo "=== Test model ==="
          ls -lh diagnostic/model/stories15M-q4_0.gguf
          sha256sum diagnostic/model/stories15M-q4_0.gguf

      - name: Prepare Android NDK
        run: |
          SDK_ROOT="$ANDROID_SDK_ROOT"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="$ANDROID_HOME"; fi
          if [ -d "$SDK_ROOT/ndk/27.3.13750724" ]; then
            NDK_DIR="$SDK_ROOT/ndk/27.3.13750724"
          else
            echo "Required NDK 27.3.13750724 was not found."
            ls -la "$SDK_ROOT/ndk" || true
            exit 1
          fi
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Fetch pinned llama.cpp
        run: bash scripts/fetch_llama_cpp.sh

      - name: Restore PocketAI native files
        run: |
          mkdir -p android/app/src/main/kotlin/com/pocketai/pocket_ai_server
          mkdir -p android/app/src/main/cpp
          cp android/pocketai_template/app/src/main/kotlin/com/pocketai/server/MainActivity.kt android/app/src/main/kotlin/com/pocketai/pocket_ai_server/MainActivity.kt
          cp android/pocketai_template/app/src/main/kotlin/com/pocketai/server/NativeAi.kt android/app/src/main/kotlin/com/pocketai/pocket_ai_server/NativeAi.kt
          cp android/pocketai_template/app/src/main/cpp/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt
          cp android/pocketai_template/app/src/main/cpp/ai_bridge.cpp android/app/src/main/cpp/ai_bridge.cpp

      - name: Enable Android externalNativeBuild
        run: python3 scripts/configure_android_native.py

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build Flutter-only x64 smoke APK
        run: |
          set -e
          cp android/app/build.gradle.kts /tmp/pocketai-build.gradle.kts
          rm -rf android/app/src/main/cpp android/app/src/main/jniLibs
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          start = s.find("externalNativeBuild {")
          if start != -1:
              depth = 0
              end = None
              for i in range(start, len(s)):
                  if s[i] == "{": depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end: s = s[:start] + s[end:]
          p.write_text(s)
          PY
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/pocketai-flutter-smoke-x64.apk

      - name: Sign Flutter-only x64 smoke APK
        run: |
          APK="build/app/outputs/flutter-apk/pocketai-flutter-smoke-x64.apk"
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias AndroidDebugKey "$APK"
          mkdir -p diagnostic/apks
          cp "$APK" diagnostic/apks/pocketai-flutter-smoke-x64.apk

      - name: Restore native build
        run: |
          cp /tmp/pocketai-build.gradle.kts android/app/build.gradle.kts
          mkdir -p android/app/src/main/cpp
          cp android/pocketai_template/app/src/main/cpp/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt
          cp android/pocketai_template/app/src/main/cpp/ai_bridge.cpp android/app/src/main/cpp/ai_bridge.cpp
          python3 scripts/configure_android_native.py

      - name: Configure native x64 runtime build
        env:
          POCKETAI_ABI: x86_64
        run: python3 scripts/configure_android_native.py

      - name: Build full native x64 runtime-test APK
        run: |
          set -e
          flutter clean
          rm -rf android/.cxx android/app/.cxx build
          flutter pub get
          echo "=== Generated Android native configuration (diagnostic only) ==="
          cd android
          grep -n -A8 -B3 'externalNativeBuild' app/build.gradle.kts || true
          grep -n 'path = file("src/main/cpp/CMakeLists.txt")' app/build.gradle.kts || true
          grep -n -A6 -B2 'abiFilters' app/build.gradle.kts || true
          cd ..
          echo "=== Standalone CMake/NDK native x64 build ==="
          rm -rf android/app/src/main/jniLibs
          mkdir -p android/app/src/main/jniLibs/x86_64
          rm -rf /tmp/pocketai-cmake-x64
          cmake -S android/app/src/main/cpp -B /tmp/pocketai-cmake-x64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/pocketai-cmake-x64 --target pocket_ai --parallel 2
          echo "=== Standalone native outputs ==="
          find /tmp/pocketai-cmake-x64 -type f -name '*.so' -print | sort
          NATIVE_LIB_DIR="/tmp/pocketai-cmake-x64/bin"
          test -d "$NATIVE_LIB_DIR"
          test -f /tmp/pocketai-cmake-x64/libpocket_ai.so
          cp /tmp/pocketai-cmake-x64/libpocket_ai.so android/app/src/main/jniLibs/x86_64/libpocket_ai.so
          for LIB in libllama.so libggml.so libggml-base.so libggml-cpu.so; do
            test -f "$NATIVE_LIB_DIR/$LIB"
            cp "$NATIVE_LIB_DIR/$LIB" "android/app/src/main/jniLibs/x86_64/$LIB"
          done
          find android/app/src/main/jniLibs/x86_64 -type f -name '*.so' -print | sort
          file android/app/src/main/jniLibs/x86_64/*.so
          readelf -h android/app/src/main/jniLibs/x86_64/libpocket_ai.so | grep -E 'Class:|Machine:'
          echo "=== Verify JNI source registration ==="
          grep -n -A8 -B3 'jniLibs' android/app/build.gradle.kts || true
          test -f android/app/src/main/jniLibs/x86_64/libpocket_ai.so
          echo "=== Build native x64 Flutter APK with jniLibs packaging ==="
          flutter build apk --release --target-platform android-x64
          echo "=== Inject native x64 libraries into final Flutter APK ==="
          FLUTTER_APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$FLUTTER_APK"
          INJECT_DIR="/tmp/pocketai-inject-x64"
          rm -rf "$INJECT_DIR"
          mkdir -p "$INJECT_DIR/lib/x86_64"
          cp android/app/src/main/jniLibs/x86_64/*.so "$INJECT_DIR/lib/x86_64/"
          cp "$FLUTTER_APK" "$INJECT_DIR/pocketai-native-x64-unsigned.apk"
          cd "$INJECT_DIR"
          zip -0 -q -u pocketai-native-x64-unsigned.apk lib/x86_64/*.so
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -f -P 4 4 pocketai-native-x64-unsigned.apk pocketai-native-x64.apk
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias AndroidDebugKey pocketai-native-x64.apk
          cd "$GITHUB_WORKSPACE"
          cp "$INJECT_DIR/pocketai-native-x64.apk" build/app/outputs/flutter-apk/pocketai-native-x64.apk
          mkdir -p /tmp/pocketai-final-apks
          cp build/app/outputs/flutter-apk/pocketai-native-x64.apk /tmp/pocketai-final-apks/pocketai-native-x64.apk
          echo "=== Verify injected native x64 libraries ==="
          unzip -Z1 build/app/outputs/flutter-apk/pocketai-native-x64.apk | grep '^lib/' | sort
          for LIB in libpocket_ai.so libllama.so libggml.so libggml-base.so libggml-cpu.so; do
            unzip -Z1 build/app/outputs/flutter-apk/pocketai-native-x64.apk | grep -qx "lib/x86_64/$LIB"
          done

      - name: Configure native ARM64 release build
        env:
          POCKETAI_ABI: arm64-v8a
        run: python3 scripts/configure_android_native.py

      - name: Build full native ARM64 APK
        run: |
          set -e
          flutter clean
          rm -rf android/.cxx android/app/.cxx build
          flutter pub get
          echo "=== Standalone CMake/NDK native ARM64 build ==="
          rm -rf android/app/src/main/jniLibs
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          rm -rf /tmp/pocketai-cmake-arm64
          cmake -S android/app/src/main/cpp -B /tmp/pocketai-cmake-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/pocketai-cmake-arm64 --target pocket_ai --parallel 2
          NATIVE_LIB_DIR="/tmp/pocketai-cmake-arm64/bin"
          test -d "$NATIVE_LIB_DIR"
          test -f /tmp/pocketai-cmake-arm64/libpocket_ai.so
          cp /tmp/pocketai-cmake-arm64/libpocket_ai.so android/app/src/main/jniLibs/arm64-v8a/libpocket_ai.so
          for LIB in libllama.so libggml.so libggml-base.so libggml-cpu.so; do
            test -f "$NATIVE_LIB_DIR/$LIB"
            cp "$NATIVE_LIB_DIR/$LIB" "android/app/src/main/jniLibs/arm64-v8a/$LIB"
          done
          find android/app/src/main/jniLibs/arm64-v8a -type f -name '*.so' -print | sort
          file android/app/src/main/jniLibs/arm64-v8a/*.so
          readelf -h android/app/src/main/jniLibs/arm64-v8a/libpocket_ai.so | grep -E 'Class:|Machine:'
          flutter build apk --release --target-platform android-arm64
          FLUTTER_APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$FLUTTER_APK"
          echo "=== Inject native ARM64 libraries into final Flutter APK ==="
          INJECT_DIR="/tmp/pocketai-inject-arm64"
          rm -rf "$INJECT_DIR"
          mkdir -p "$INJECT_DIR/lib/arm64-v8a"
          cp android/app/src/main/jniLibs/arm64-v8a/*.so "$INJECT_DIR/lib/arm64-v8a/"
          cp "$FLUTTER_APK" "$INJECT_DIR/pocketai-native-arm64-unsigned.apk"
          cd "$INJECT_DIR"
          zip -0 -q -u pocketai-native-arm64-unsigned.apk lib/arm64-v8a/*.so
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -f -P 4 4 pocketai-native-arm64-unsigned.apk pocketai-native-arm64.apk
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias AndroidDebugKey pocketai-native-arm64.apk
          cd "$GITHUB_WORKSPACE"
          mkdir -p build/app/outputs/flutter-apk
          cp "$INJECT_DIR/pocketai-native-arm64.apk" build/app/outputs/flutter-apk/pocketai-native-arm64.apk
          mkdir -p build/app/outputs/flutter-apk
          cp /tmp/pocketai-final-apks/pocketai-native-x64.apk build/app/outputs/flutter-apk/pocketai-native-x64.apk
          echo "=== Verify injected native ARM64 libraries ==="
          unzip -Z1 build/app/outputs/flutter-apk/pocketai-native-arm64.apk | grep '^lib/' | sort
          for LIB in libpocket_ai.so libllama.so libggml-base.so libggml-cpu.so; do
            unzip -Z1 build/app/outputs/flutter-apk/pocketai-native-arm64.apk | grep -qx "lib/arm64-v8a/$LIB"
          done

      - name: Deep APK package validation
        run: |
          set -u
          X64="build/app/outputs/flutter-apk/pocketai-native-x64.apk"
          ARM64="build/app/outputs/flutter-apk/pocketai-native-arm64.apk"
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p diagnostic/apk-validation
          FAILED=0
          for apk in "$X64" "$ARM64"; do
            echo
            echo "===== VALIDATING $apk ====="
            if [ ! -s "$apk" ]; then echo "MISSING_OR_EMPTY_APK"; FAILED=1; continue; fi
            file "$apk"
            echo "--- ZIP TEST ---"
            unzip -t "$apk" || FAILED=1
            echo "--- ZIPALIGN ---"
            "$BT/zipalign" -c -P 4 -v 4 "$apk" || FAILED=1
            echo "--- APK SIGNATURE ---"
            "$BT/apksigner" verify --verbose --print-certs "$apk" || FAILED=1
            echo "--- BADGING ---"
            "$BT/aapt2" dump badging "$apk" || FAILED=1
            if [[ "$apk" == *arm64* ]]; then abi="arm64-v8a"; else abi="x86_64"; fi
            echo "--- REQUIRED NATIVE LIBRARIES ($abi) ---"
            for lib in libpocket_ai.so libllama.so libggml.so libggml-base.so libggml-cpu.so; do
              if unzip -Z1 "$apk" | grep -Fxq "lib/$abi/$lib"; then
                echo "OK lib/$abi/$lib"
              else
                echo "MISSING lib/$abi/$lib"
                FAILED=1
              fi
            done
          done
          echo
          echo "--- SHA256 ---"
          sha256sum "$X64" "$ARM64" | tee diagnostic/apk-validation/sha256.txt || FAILED=1
          if [ "$FAILED" -ne 0 ]; then
            echo "DEEP_APK_VALIDATION=FAILED" | tee diagnostic/apk-validation/result.txt
            exit 1
          fi
          echo "DEEP_APK_VALIDATION=PASSED" | tee diagnostic/apk-validation/result.txt

      - name: Static APK diagnostics
        run: |
          set +e
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p diagnostic
          {
            echo "PocketAI Android Diagnostic"
            echo "Commit: $GITHUB_SHA"
            echo "=== Flutter ==="
            flutter --version
            echo "=== Java ==="
            java -version 2>&1
            echo "=== APK files ==="
            ls -lh build/app/outputs/flutter-apk/*.apk
            echo "=== SHA256 ==="
            sha256sum build/app/outputs/flutter-apk/*.apk
            for APK in diagnostic/apks/pocketai-flutter-smoke-x64.apk build/app/outputs/flutter-apk/pocketai-native-x64.apk build/app/outputs/flutter-apk/pocketai-native-arm64.apk; do
              echo
              echo "===== $APK ====="
              echo "--- AAPT2 BADGING ---"
              "$BT/aapt2" dump badging "$APK"
              echo "--- MANIFEST ---"
              "$BT/aapt2" dump xmltree "$APK" AndroidManifest.xml | grep -E 'package=|versionCode=|versionName=|minSdkVersion=|targetSdkVersion=|uses-permission|uses-feature|uses-sdk' || true
              echo "--- NATIVE ABIS ---"
              unzip -Z1 "$APK" | grep '^lib/' | sed -E 's#^lib/([^/]+)/.*#\1#' | sort -u || true
              echo "--- NATIVE LIBRARIES ---"
              unzip -Z1 "$APK" | grep -E '(^|/)lib.*\.so$' | sort || true
              echo "--- ELF HEADERS ---"
              rm -rf /tmp/apk_extract
              mkdir -p /tmp/apk_extract
              unzip -q "$APK" -d /tmp/apk_extract || true
              find /tmp/apk_extract/lib -name '*.so' -type f -print0 2>/dev/null | while IFS= read -r -d '' SO; do
                echo "FILE: $SO"
                file "$SO" || true
                readelf -h "$SO" 2>/dev/null | grep -E 'Class:|Machine:' || true
              done
              echo "--- ZIPALIGN ---"
              "$BT/zipalign" -c -P 4 -v 4 "$APK"
              echo "--- SIGNATURE ---"
              "$BT/apksigner" verify --verbose --print-certs "$APK"
            done
          } | tee diagnostic/report.txt

      - name: Android 13 x86_64 emulator Flutter UI install test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_MODEL_PATH: ${{ github.workspace }}/diagnostic/model/stories15M-q4_0.gguf
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          script: python3 diagnostic/scripts/emulator_install_test.py

      - name: Diagnostic summary
        if: always()
        run: |
          set +e
          DIAG_DIR="$GITHUB_WORKSPACE/diagnostic"
          mkdir -p "$DIAG_DIR"
          {
            echo "PocketAI Diagnostic Summary"
            echo "==========================="
            echo "Flutter/UI x64 APK: built, signed and tested on Android 13 x86_64 emulator"
            echo "Full native ARM64 APK: built, signed and statically checked"
            echo "ARM64 native APK emulator installation: intentionally skipped due ABI mismatch"
            echo
            if [ -f "$DIAG_DIR/RESULT.txt" ]; then
              echo "=== CLASSIFICATION ==="
              cat "$DIAG_DIR/RESULT.txt"
            else
              echo "DIAGNOSTIC_RESULT=NO_CLASSIFICATION_FILE"
              echo "The emulator test did not produce a final classification."
            fi
            echo
            echo "The emulator installation file contains the exact adb/PackageManager result."
          } > "$DIAG_DIR/SUMMARY.txt"
          cat "$DIAG_DIR/SUMMARY.txt"
          test -f "$DIAG_DIR/SUMMARY.txt"

      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketai-android-diagnostic
          if-no-files-found: warn
          path: |
            diagnostic/
            diagnostic/apks/pocketai-flutter-smoke-x64.apk
            build/app/outputs/flutter-apk/pocketai-native-x64.apk
            build/app/outputs/flutter-apk/pocketai-native-arm64.apk
